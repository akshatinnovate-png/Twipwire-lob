<!doctype html>
<html><head><meta charset="utf-8"><title>TRIPWIRE-LOB</title>
<style>
  html,body{margin:0;height:100%;background:#f2879f;background-image:radial-gradient(#231c1f 1px,transparent 1.2px);background-size:14px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;color:#231c1f}
  .wrap{height:100%;display:flex;align-items:center;justify-content:center}
  .win{width:min(620px,90vw);background:#f4f1f2;border:3px solid #231c1f;box-shadow:8px 8px 0 #231c1f}
  .title{background:#231c1f;color:#f4f1f2;padding:6px 10px;display:flex;justify-content:space-between}
  .content{padding:22px}
  h1{font-family:Impact,'Arial Black',sans-serif;font-size:54px;line-height:.9;margin:0 0 14px;letter-spacing:-1px}
  .bar{height:14px;border:2px solid #231c1f;overflow:hidden;margin:16px 0 8px}
  .bar i{display:block;height:100%;width:30%;background:#231c1f;animation:slide 1.2s infinite ease-in-out}
  @keyframes slide{0%{margin-left:-30%}100%{margin-left:100%}}
  pre{white-space:pre-wrap;background:#231c1f;color:#f2879f;padding:10px;max-height:300px;overflow:auto;font-size:12px}
  .err h1{color:#c0263a}
</style></head>
<body><div class="wrap"><div class="win"><div class="title"><span>TW.OS1 ▸ starting engine</span><span>⊠</span></div>
<div class="content" id="c">
  <h1>TRIPWIRE<br>-LOB</h1>
  <div>Starting the engine and pre-running 20,000 calm events so the detectors are calibrated…</div>
  <div class="bar"><i></i></div>
  <div style="font-size:12px">Paper trading only. No order ever leaves this machine.</div>
</div></div></div>
<script>
  const err = new URLSearchParams(location.search).get('error');
  if (err) {
    const c = document.getElementById('c'); c.classList.add('err');
    c.innerHTML = '<h1>ENGINE<br>DID NOT START</h1><div>The Python backend stopped. Its last output:</div><pre></pre>' +
      '<div style="font-size:12px">Running from source? Install the requirements (pip install -r requirements.txt) or set TRIPWIRE_PYTHON. Then Cockpit ▸ Restart engine.</div>';
    c.querySelector('pre').textContent = err;
  }
</script></body></html>
