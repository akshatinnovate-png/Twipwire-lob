name: tests and desktop installers

# Every push: unit tests. A tag like v1.0.0 (or a manual run): build the desktop app for
# Windows, macOS and Linux (PyInstaller backend + Electron) and attach the installers to a
# GitHub release for that tag.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Python backend (PyInstaller)
        run: |
          pip install -r ../requirements.txt pyinstaller certifi
          pyinstaller --noconfirm --distpath backend-dist --workpath build-py tripwire.spec
      - name: Backend smoke test
        shell: bash
        run: |
          EXE=backend-dist/tripwire/tripwire; [ -f "$EXE.exe" ] && EXE="$EXE.exe"
          "$EXE" --help
          "$EXE" --home "$RUNNER_TEMP/twhome" report > /dev/null
      - run: npm ci
      - name: Installers (electron-builder)
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: TRIPWIRE-LOB-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            TRIPWIRE-LOB desktop app. Paper trading only: no order ever leaves your machine.
            Windows: TRIPWIRE-LOB-Setup installs; TRIPWIRE-LOB-Portable runs without installing (unsigned: More info > Run anyway). macOS: unsigned .dmg (right-click > Open the first time).
            Linux: AppImage (chmod +x) or .deb. Data and results go to Documents/TripwireLOB.
